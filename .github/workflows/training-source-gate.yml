name: NEXUS Training Source Isolation Gate
on:
  push:
    branches: [main]
    paths: ['training/source_gate.py','tests/test_source_gate.py','.github/workflows/training-source-gate.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest tests/test_source_gate.py -v
