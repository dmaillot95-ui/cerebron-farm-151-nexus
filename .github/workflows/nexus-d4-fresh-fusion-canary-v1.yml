name: NEXUS D4 Fresh Dual-Core Fusion Canary V1
on:
  push:
    branches: [main]
    paths:
      - 'config/nexus-d4-fresh-fusion-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU inference runtime
        run: |
          python -m pip install --quiet --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet --no-cache-dir "transformers>=4.53,<5" accelerate safetensors sentencepiece
      - name: Run NEXUS fresh fusion canary
        run: python worker/nexus_d4_fresh_fusion_canary_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-d4-fresh-fusion-canary-v1
          path: artifacts/nexus_d4_fresh_fusion_canary_v1.json
          if-no-files-found: error
      - name: Persist D4 receipt
        run: |
          mkdir -p receipts/d4
          cp artifacts/nexus_d4_fresh_fusion_canary_v1.json receipts/d4/nexus-d4-fresh-fusion-canary-${{ github.run_id }}.json
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/d4/nexus-d4-fresh-fusion-canary-${{ github.run_id }}.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: NEXUS D4 fresh fusion ${{ github.run_id }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
